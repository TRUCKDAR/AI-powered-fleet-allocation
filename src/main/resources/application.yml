server:
  port: 8085

spring:
  application:
    name: ms-ai-fleet-allocation

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:truckdar_alerts_db}
    username: ${DB_USER:truckdar_user}
    password: ${DB_PASSWORD:truckdar_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 3000
    consumer:
      group-id: fleet-allocation-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

truckdar:
  services:
    load-allocation-url: ${LOAD_ALLOCATION_URL:http://localhost:8083}
    fleets-drivers-url: ${FLEETS_DRIVERS_URL:http://localhost:8081}
  kafka:
    topic:
      load-events: truckdar.events.load-allocation
      allocation-results: truckdar.events.fleet-allocation-results